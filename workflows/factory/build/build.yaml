name: factory-build
description: >-
  Build one Bead in one pass: work, checks, a spec review that only reads, then a
  standards review that fixes what it finds inside the diff and commits it, the checks
  again, and a landing the Mac's Profile chooses: a pull request and its squash merge, or
  the commits squashed onto the base branch, checked again and pushed. A withheld review
  ends the Run with its findings on the Bead, for the Project Manager to decide. Start it
  with "<pane> · <bead id>". Needs FACTORY_CHECK in the project's .archon/.env.
provider: pi
nodes:
  - id: bead
    bash: '"$HOME/.local/share/factory/bin/bead" "$ARGUMENTS"'

  # The Factory's conventions for each kind of AI node (prompts/ in the Factory's repo):
  # every AI node's prompt starts with one of them.
  - id: prompts
    bash: '"$HOME/.local/share/factory/bin/node-prompts" "${LIBRARY:-$ARCHON_HOME/workflows}/factory/build"'

  - id: work
    depends_on: [bead, prompts]
    model: "@work"
    idle_timeout: 300000
    prompt: |
      $prompts.output.marker_work
      $prompts.output.work

      $bead.output

  - id: checks
    depends_on: [work]
    bash: |
      if out=$(sh -c "$FACTORY_CHECK" 2>&1); then r=PASSED; else r=FAILED; fi
      printf 'CHECKS %s\n%s\n' "$r" "$(printf '%s\n' "$out" | tail -40)"

  # The work node's checks (flows/work) ran when its agent tried to finish. When it finished
  # with checks still failing, this comments them on the Bead and fails, so neither review
  # runs and no usage is spent reviewing unfinished work (fac-qpv.3.3).
  - id: work-finished
    depends_on: [checks]
    bash: '"$HOME/.local/share/factory/bin/work-finished" "$("$HOME/.local/share/factory/bin/bead" --id "$ARGUMENTS")"'

  # One review pass, in order (fac-qpv.4). The spec review reads first: a change that
  # misses what the Bead asked needs the Project Manager's judgment, so a withheld spec
  # review ends the Run before any fixing is spent on it.
  - id: spec
    depends_on: [work-finished]
    model: "@spec-review"
    idle_timeout: 300000
    allowed_tools: [read, bash]
    prompt: |
      $prompts.output.review_spec

      The diff is `git diff $BASE_BRANCH...HEAD`; the commits are `git log --oneline $BASE_BRANCH..HEAD`.

      $bead.output

      $checks.output
    output_format: &review-output
      type: object
      properties:
        approved: {type: boolean}
        feedback: {type: string}
      required: [approved, feedback]

  # The standards review fixes what it finds inside the diff and commits it, so a small
  # issue never costs another Run (the Human, 2026-11-06). It withholds only for a defect
  # it cannot fix there.
  - id: standards
    depends_on: [spec]
    when: "$spec.output.approved == true"
    model: "@standards-review"
    idle_timeout: 300000
    prompt: |
      $prompts.output.review_standards

      The diff is `git diff $BASE_BRANCH...HEAD`; the commits are `git log --oneline $BASE_BRANCH..HEAD`.

      $bead.output
    output_format: *review-output

  # The check again, since the standards review may have changed files. It fails the
  # node, and so stops the landing, when the check fails.
  - id: recheck
    depends_on: [standards]
    when: "$standards.output.approved == true"
    bash: |
      out=$(sh -c "$FACTORY_CHECK" 2>&1); status=$?
      printf '%s\n' "$out" | tail -40
      exit $status

  # A withheld review's findings go on the Bead, so the Project Manager can decide.
  # The feedback is quoted into a heredoc so its backticks and dollar signs stay text.
  - id: spec-withheld
    depends_on: [spec]
    when: "$spec.output.approved == false"
    bash: |
      bd comments add "$("$HOME/.local/share/factory/bin/bead" --id "$ARGUMENTS")" "$(cat <<'FEEDBACK'
      Spec review withheld approval in Run $WORKFLOW_ID; the commits stay on its branch:
      $spec.output.feedback
      FEEDBACK
      )"

  - id: standards-withheld
    depends_on: [standards]
    when: "$standards.output.approved == false"
    bash: |
      bd comments add "$("$HOME/.local/share/factory/bin/bead" --id "$ARGUMENTS")" "$(cat <<'FEEDBACK'
      Standards review withheld approval in Run $WORKFLOW_ID; the commits stay on its branch:
      $standards.output.feedback
      FEEDBACK
      )"

  # bin/land lands the Run's commits the way this Mac's Profile says (fac-qpv.6.4): a pull
  # request into the base branch and its squash merge, or the commits squashed onto the
  # base branch, checked again and pushed. Before any git command that moves a branch it
  # refuses a target the Profile protects, so no Run on a Mac whose Profile protects its
  # main or develop branches reaches them.
  - id: land
    depends_on: [recheck]
    bash: '"$HOME/.local/share/factory/bin/land"'

  # bin/finish reads how the Run ended from the notes in the Run's artifacts, never from a
  # node's output: Archon refuses to splice a failed node's output, so that reference
  # stopped this node exactly when the Project Manager most needed telling.
  - id: tell-project-manager
    depends_on: [land, work-finished, spec-withheld, standards-withheld]
    trigger_rule: all_done
    bash: '"$HOME/.local/share/factory/bin/finish" factory-build'
