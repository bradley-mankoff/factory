name: e1-effort
description: Does per-node effort reach pi 1.3? Same prompt at low and at max.
provider: pi
model: opencode-go/deepseek-v4.1-flash
nodes:
  - id: e-low
    prompt: "How many prime numbers are there between 1000 and 1100? Work it out, then reply with only the number."
    effort: low
    allowed_tools: []
  - id: e-max
    prompt: "How many prime numbers are there between 1000 and 1100? Work it out, then reply with only the number."
    effort: max
    allowed_tools: []
  - id: e-none
    prompt: "How many prime numbers are there between 1000 and 1100? Work it out, then reply with only the number."
    allowed_tools: []
